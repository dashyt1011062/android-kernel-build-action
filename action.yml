name: 'GKI Kernel Module Build Action'
description: 'Build an Android GKI kernel module with Droid DDK.'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  tag:
    description: 'Specify the Android kernel target to build for (e.g., android17-6.18).'
    default: 'android13-5.15'
    required: true
  arch:
    description: 'Specify the kernel module architecture (aarch64 or arm64).'
    required: true
    default: 'aarch64'
  module-path:
    description: 'Specify the name of the kernel module source artifact.'
    required: true
  module-name:
    description: 'Specify the kernel module directory and output name.'
    required: true
  registry:
    description: 'Select the Droid DDK image registry (ghcr or dockerhub).'
    default: 'ghcr'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Download LKM source code
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.module-path }}
        path: ${{ inputs.module-name }}

    - name: Validate inputs
      shell: bash
      env:
        DDDK_TAG: ${{ inputs.tag }}
        DDDK_ARCH: ${{ inputs.arch }}
        MODULE_DIR: ${{ inputs.module-name }}
        DDDK_REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        valid_tags=(
          android13-5.15
          android14-5.15
          android14-6.1
          android15-6.1
          android15-6.6
          android16-6.6
          android16-6.12
          android17-6.12
          android17-6.18
        )
        if [[ ! " ${valid_tags[*]} " =~ " ${DDDK_TAG} " ]]; then
          printf 'Invalid tag: %s. Supported tags: %s\n' \
            "$DDDK_TAG" "${valid_tags[*]}" >&2
          exit 1
        fi
        case "$DDDK_ARCH" in
          aarch64|arm64) ;;
          *)
            printf 'Invalid arch: %s. Droid DDK v2 builds ARM64 modules.\n' \
              "$DDDK_ARCH" >&2
            exit 1
            ;;
        esac
        case "$DDDK_REGISTRY" in
          ghcr|dockerhub) ;;
          *)
            printf 'Invalid registry: %s. Supported registries: ghcr, dockerhub.\n' \
              "$DDDK_REGISTRY" >&2
            exit 1
            ;;
        esac
        if [[ ! -d "$MODULE_DIR" ]]; then
          printf 'Module directory does not exist: %s\n' "$MODULE_DIR" >&2
          exit 2
        fi
        if [[ ! -f "$MODULE_DIR/Makefile" ]]; then
          printf 'Module Makefile does not exist: %s/Makefile\n' "$MODULE_DIR" >&2
          exit 3
        fi
        if [[ ! -f "$MODULE_DIR/$MODULE_DIR.c" ]]; then
          printf 'Module source does not exist: %s/%s.c\n' \
            "$MODULE_DIR" "$MODULE_DIR" >&2
          exit 4
        fi

    - name: Install dddk
      shell: bash
      env:
        DDDK_BIN_DIR: ${{ runner.temp }}/droid-ddk/bin
        DDDK_REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        mkdir -p "$DDDK_BIN_DIR" "$HOME/.droid-ddk"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
          --location --retry 3 --retry-all-errors \
          --output "$DDDK_BIN_DIR/dddk" \
          https://raw.githubusercontent.com/feicong/droid-ddk/f0b448f8b78271ac5537b4fd0e87a22a2aaa2cbf/scripts/dddk
        chmod 0755 "$DDDK_BIN_DIR/dddk"
        case "$DDDK_REGISTRY" in
          ghcr) dddk_source=github ;;
          dockerhub) dddk_source=docker ;;
        esac
        printf 'mode=docker\nsource=%s\n' "$dddk_source" > .dddk-config
        chmod 0600 .dddk-config
        printf '%s\n' "$DDDK_BIN_DIR" >> "$GITHUB_PATH"
        case "$(uname -m)" in
          x86_64|amd64) platform=linux/amd64 ;;
          aarch64|arm64) platform=linux/arm64 ;;
          *)
            printf 'Unsupported runner architecture: %s\n' "$(uname -m)" >&2
            exit 2
            ;;
        esac
        printf 'DDDK_PLATFORM=%s\n' "$platform" >> "$GITHUB_ENV"

    - name: Pull Droid DDK image
      shell: bash
      env:
        DDDK_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        dddk pull --target "$DDDK_TAG" --platform "$DDDK_PLATFORM"

    - name: Build kernel module
      shell: bash
      env:
        DDDK_TAG: ${{ inputs.tag }}
        MODULE_DIR: ${{ inputs.module-name }}
      run: |
        set -euo pipefail
        dddk build --target "$DDDK_TAG" --platform "$DDDK_PLATFORM" \
          --module "$MODULE_DIR"

    - name: Prepare artifacts
      shell: bash
      env:
        DDDK_TAG: ${{ inputs.tag }}
        MODULE_DIR: ${{ inputs.module-name }}
      run: |
        set -euo pipefail
        module_file="$MODULE_DIR/$MODULE_DIR.ko"
        if [[ ! -f "$module_file" ]]; then
          printf 'Compiled module does not exist: %s\n' "$module_file" >&2
          exit 5
        fi
        rm -rf output
        mkdir -p output
        cp "$module_file" "output/${DDDK_TAG}_${MODULE_DIR}.ko"

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Image-${{ inputs.tag }}-${{ inputs.arch }}
        path: ./output/*
        if-no-files-found: error
